name: Assets Sync

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  verify-minified-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild assets
        run: node scripts/build-assets.mjs build

      - name: Verify generated files are committed
        run: |
          git diff --quiet --exit-code || (
            echo "Hay assets minificados desactualizados. Ejecuta 'node scripts/build-assets.mjs build' y sube los cambios generados."
            git diff --name-only
            exit 1
          )
